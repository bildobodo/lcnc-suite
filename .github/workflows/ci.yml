name: CI

# Off-machine checks (issue #26). Runs the non-LinuxCNC subset: frontend lint /
# build / unit / e2e, and the backend pure + dispatch tests under a fake
# linuxcnc. The on-machine suite (test_viewer_init.py, hardware behaviour) is
# out of scope here.
on:
  push:
    branches: [main, development, "refactor/**", "harden/**"]
  pull_request:

# The runner is PINNED (2026-10-21): ubuntu-latest moved to Ubuntu 26.04 on
# 2026-10-19, where the Playwright version the frontend pins installs no
# Chromium ("Playwright does not support chromium on ubuntu26.04-x64"). Move it
# with a Playwright update, deliberately — like the backend's pip pins.
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lcnc-webui
    steps:
      - uses: actions/checkout@v4
        with:
          # machineModel.test.ts reads the machine-xyzac STLs off disk —
          # without LFS the checkout delivers pointer files, not geometry.
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lcnc-webui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # --timeout is per step: the unit step takes ~19 min here, the browser
      # step ran out of the default 30 min at test 332 of ~550 (2026-10-21)
      # ONE browser worker here (the local default is 3, one per two cores of
      # the 6-core VM): on this 4-vCPU runner three workers with their mocks
      # and Chromium starved each other — 22 of 886 tests ran out of time or
      # missed a frame budget on 2026-11-07 (run 42406737346: timeouts, glide
      # frames, hold windows), all green locally; two workers still missed 4
      # (the code panel's glide steps, a touch form scan; run 42419484565).
      # One worker, more time.
      - run: python3 ../scripts/test_suite.py offline --component frontend --timeout 14400
        env:
          LCNC_E2E_WORKERS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-evidence
          path: |
            runlogs/test-suite/
            lcnc-webui/playwright-report/
            lcnc-webui/test-results/

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lcnc-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The test selector's guards (scripts/test_select, part of the backend
      # offline gate since the round gate, Codex R260) parse the WebUI's
      # sources with its own TypeScript: lcnc-webui/node_modules must exist
      # (red since 2026-11-07: "readscan.mjs failed … MODULE_NOT_FOUND").
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lcnc-webui/package-lock.json
      - run: npm ci
        working-directory: lcnc-webui
      # the install probe's browser check (scripts/test_install_probe.py) starts Chromium
      - run: npx playwright install --with-deps chromium
        working-directory: lcnc-webui
      # gateway.py's module-level third-party imports are only fastapi + msgspec
      # + click; the fake linuxcnc (conftest.py) stands in for the real binding,
      # and machine/ is committed so the StaticFiles mount resolves. NumPy is
      # required by the vectorized limit/rotary checks. Install it only in this
      # isolated CI environment; runtime keeps the system LinuxCNC NumPy.
      # cv2/PIL remain lazy camera dependencies outside this test subset.
      # Tests using the real rs274 canon explicitly skip when it is absent.
      # python-multipart is required by FastAPI to analyze the upload route at
      # import time (UploadFile/Form), even though no test posts a file.
      # requests: scripts/perf_matrix.py imports it at module level, and the
      # backend step perf-matrix (scripts/test_perf_matrix.py) imports the script.
      # PINNED to the versions the dev venv runs (unpinned installs drifted:
      # a newer starlette switched TestClient to httpx2, which wasn't
      # installed, and collection died with exit 2 for two months). Bump
      # these together with the venv, deliberately.
      - run: >
          pip install fastapi==0.136.1 starlette==1.0.0 httpx==0.28.1
          msgspec==0.21.1 click==8.3.3 python-multipart==0.0.28 -r requirements-test.txt
          numpy==2.2.4 scipy==1.15.3 websockets==16.0 requests==2.32.3
      - run: python ../scripts/test_suite.py offline --component backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: runlogs/test-suite/
