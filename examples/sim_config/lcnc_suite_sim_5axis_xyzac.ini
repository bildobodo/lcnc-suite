# SPDX-License-Identifier: GPL-2.0-or-later
# 5 Axis XYZAC: original 500 x 400 x 400 mm XYZAC trunnion example.
# Simulation only; loopback joints with immediate, switchless homing.
# M429 = identity (startup); M428 = xyzac TCP. All pivot geometry pins are zero.
# Machine origin: intersection of A and C at the platter top, A=C=0.
# Z is spindle-nose height above that origin (100..500 mm), home at 500.
# Launch from this directory. See xyzac5/README.md.
[EMC]
VERSION = 1.1
MACHINE = 5 Axis XYZAC
DEBUG = 0

[DISPLAY]
DISPLAY = lcnc-suite
OPEN_FILE = xyzac5/demo.ngc
CONFIRM_EXIT = False
WEBUI_HOST = 127.0.0.1
WEBUI_PORT = 8000
WEBUI_BROWSER = 1
WEBUI_DEV = 0
WEBUI_MACHINE_DIR = machine-5axis-xyzac
WEBUI_STATUS_DELTA = 1
WEBUI_ADAPTIVE_POLL = 1
WEBUI_IDLE_POLL_HZ = 5
WEBUI_WIRE_FORMAT = msgpack
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
DEFAULT_SPINDLE_SPEED = 3000
DEFAULT_LINEAR_VELOCITY = 25
MAX_LINEAR_VELOCITY = 100
MIN_LINEAR_VELOCITY = 0.1
DEFAULT_ANGULAR_VELOCITY = 5
MAX_ANGULAR_VELOCITY = 30
MIN_ANGULAR_VELOCITY = 0.1
PROGRAM_PREFIX = xyzac5
INCREMENTS = 10mm 1mm .1mm .01mm
GEOMETRY = XYZAC

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-code

[RS274NGC]
RS274NGC_STARTUP_CODE = F100 S3000 G21 G17 G40 G49 G54 G64 P0.01 G80 G90 G91.1 G92.1 G94 G97 G98
PARAMETER_FILE = xyzac5/sim.var
HAL_PIN_VARS = 1
SUBROUTINE_PATH = remap_subs
REMAP = M428 modalgroup=10 ngc=428remap
REMAP = M429 modalgroup=10 ngc=429remap
USER_M_PATH = ./
FEATURES = 12

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = hallib/core_sim_5.hal
HALFILE = hallib/spindle_sim.hal
HALFILE = hallib/lcnc_webui.hal
HALCMD = net :kinstype-select motion.analog-out-02 => motion.switchkins-type
HALCMD = setp xyzac-trt-kins.x-rot-point 0
HALCMD = setp xyzac-trt-kins.y-rot-point 0
HALCMD = setp xyzac-trt-kins.z-rot-point 0
HALCMD = setp xyzac-trt-kins.x-offset 0
HALCMD = setp xyzac-trt-kins.y-offset 0
HALCMD = setp xyzac-trt-kins.z-offset 0
HALCMD = net xyzac-tool-offset motion.tooloffset.z => xyzac-trt-kins.tool-offset
HALUI = halui
TWOPASS = on

[HALUI]
HALUI = halui

[TRAJ]
# Seed the unhomed simulator at Z500; retain joint positions across restarts.
POSITION_FILE = xyzac5/position.txt
AXES = 5
SPINDLES = 1
COORDINATES = X Y Z A C
HOME = 0 0 500 0 0
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 25
MAX_LINEAR_VELOCITY = 100

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = xyzac5/tool.tbl

[KINS]
KINEMATICS = xyzac-trt-kins sparm=identityfirst
JOINTS = 5

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 12000
INCREMENT = 100

[AXIS_X]
MIN_LIMIT = -250
MAX_LIMIT = 250
MAX_VELOCITY = 100
MAX_ACCELERATION = 500

[JOINT_0]
TYPE = LINEAR
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 1
MIN_LIMIT = -250
MAX_LIMIT = 250
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
FERROR = 0.05
MIN_FERROR = 0.01

[AXIS_Y]
MIN_LIMIT = -200
MAX_LIMIT = 200
MAX_VELOCITY = 100
MAX_ACCELERATION = 500

[JOINT_1]
TYPE = LINEAR
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 1
MIN_LIMIT = -200
MAX_LIMIT = 200
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
FERROR = 0.05
MIN_FERROR = 0.01

[AXIS_Z]
MIN_LIMIT = 100
MAX_LIMIT = 500
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
OFFSET_AV_RATIO = 0.2

[JOINT_2]
TYPE = LINEAR
HOME = 500
HOME_OFFSET = 500
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
MIN_LIMIT = 100
MAX_LIMIT = 500
MAX_VELOCITY = 100
MAX_ACCELERATION = 500
FERROR = 0.05
MIN_FERROR = 0.01

[AXIS_A]
MIN_LIMIT = -110
MAX_LIMIT = 110
MAX_VELOCITY = 30
MAX_ACCELERATION = 120

[JOINT_3]
TYPE = ANGULAR
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 2
MIN_LIMIT = -110
MAX_LIMIT = 110
MAX_VELOCITY = 30
MAX_ACCELERATION = 120
FERROR = 1.0
MIN_FERROR = 0.25

[AXIS_C]
MIN_LIMIT = -36000
MAX_LIMIT = 36000
MAX_VELOCITY = 30
MAX_ACCELERATION = 120

[JOINT_4]
TYPE = ANGULAR
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 2
MIN_LIMIT = -36000
MAX_LIMIT = 36000
MAX_VELOCITY = 30
MAX_ACCELERATION = 120
FERROR = 1.0
MIN_FERROR = 0.25
