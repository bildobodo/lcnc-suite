# ══════════════════════════════════════════════════════════════════════
# TWP (Tilted Work Plane) variant — XYZACB-TRSRN nutating-head machine.
#
# ┌────────────────────────────────────────────────────────────────────┐
# │ PRECONDITION — this config will NOT load until the kinematics      │
# │ component is compiled and installed ONCE:                          │
# │                                                                    │
# │   sudo halcompile --install examples/sim_config/twp/xyzacb_trsrn.comp │
# │                                                                    │
# │ (re-run it whenever that .comp changes). NOT the copy under        │
# │ scripts/kins_oracle/ — that one is the FIXTURE ORACLE, taken from  │
# │ current LinuxCNC master, and uses a HAL pin API 2.9's halcompile   │
# │ cannot parse. Same kinematics math, different era of scaffolding.  │
# │ Not done by install.sh on purpose: nothing else in this project    │
# │ builds a realtime component, and a failed halcompile would break   │
# │ the install for everyone who does not want TWP.                    │
# └────────────────────────────────────────────────────────────────────┘
#
# The machine: X/Y/Z head slides, an A rotary FACEPLATE carrying the work
# (axis along machine X), and a nutating spindle head — C swivels about Z,
# B nutates about an axis 55° off it. G68.2/G53.x tilt the work plane and
# switch the kinematics to TOOL mode; the web UI's offline stack (preview,
# scrub, soft limits, collision sweep) follows via the marker comments the
# forked remap emits in preview. See examples/sim_config/twp/README.md.
#
# Coordinates: X Y Z A B C   (joints 0..5 in that order)
# ══════════════════════════════════════════════════════════════════════

[EMC]
VERSION = 1.1
MACHINE = lcnc-suite Sim TWP
DEBUG = 0

[DISPLAY]
DISPLAY = lcnc-suite
# Blank, like the other sims. The TWP demo lives in twp/demos/ but a program
# only loads from PROGRAM_PREFIX, so copy it there to run it:
#   cp examples/sim_config/twp/demos/simple_example.ngc ~/linuxcnc/nc_files/
# (o<square> is found via SUBROUTINE_PATH and does NOT need copying.)
OPEN_FILE = ~/linuxcnc/nc_files/blank.ngc
CONFIRM_EXIT = False

# ─────────────────────────────────────────────────────────────────────
# lcnc-suite gateway settings (see lcnc_suite_sim_5axis.ini for the
# fully-commented reference; only the values live here)
# ─────────────────────────────────────────────────────────────────────
WEBUI_HOST = 0.0.0.0

# WEBUI_TOKEN: REQUIRED whenever WEBUI_HOST is non-loopback. Generate:
#     python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# WEBUI_TOKEN = <paste-generated-token-here>

WEBUI_PORT = 8000
WEBUI_BROWSER = 1
WEBUI_DEV = 0

# 3D viewer machine model: generated by scripts/vismach_to_stl_trsrn.py.
# Its geometry constants and the [HAL]HALCMD setp lines below are the SAME
# numbers — change one and you must change the other, or the 3D model and
# the kinematics disagree.
WEBUI_MACHINE_DIR = ~/lcnc-suite/examples/sim_config/machine-xyzacb-trsrn

WEBUI_STATUS_DELTA = 1
WEBUI_ADAPTIVE_POLL = 1
WEBUI_IDLE_POLL_HZ = 5
WEBUI_WIRE_FORMAT = msgpack
WEBUI_WS_INIT_CONCURRENCY = 20
WEBUI_ASYNCIO_DEBUG = 0
WEBUI_GC_FREEZE = 0

DEBUG = 0
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 2.0
MIN_SPINDLE_OVERRIDE = 0.5
DEFAULT_SPINDLE_SPEED = 300
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 200
MIN_LINEAR_VELOCITY = 0.1
DEFAULT_ANGULAR_VELOCITY = 5
MAX_ANGULAR_VELOCITY = 30
MIN_ANGULAR_VELOCITY = 1
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 100mm 10mm 5mm 1mm .5mm .1mm .05mm .01mm
GEOMETRY = XYZ

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files

[RS274NGC]
RS274NGC_STARTUP_CODE = F100 S50 G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G91.1 G92.1 G94 G97 G98
# Own var file — TWP writes the plane origin into G59..G59.3 (G10 L2 P6..9),
# which must not leak into the other sims' fixtures.
PARAMETER_FILE = sim_twp.var
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
# The switchkins remaps read #<_hal[motion.switchkins-type]> to verify the
# mode switch landed (task only).
HAL_PIN_VARS = 1
# Adjust paths below to where you cloned lcnc-suite. The TWP wrappers come
# FIRST: they define G53.x/G68.x, which nothing else provides.
# Paths are RELATIVE TO THIS INI'S DIRECTORY, unlike the other sim INIs which
# hardcode ~/lcnc-suite. That is a consequence of the 2026-08-24 split: the TWP
# product lives on feat/twp, checked out as a worktree (~/twp-checkout), so
# ~/lcnc-suite/examples/sim_config/twp/ does not exist on development at all
# and every absolute path here dangled. It failed silently — the preview gate
# reported eleven DRIFTED FIELDS on simple_example.ngc when the truth was that
# no subroutine resolved and nothing parsed. Relative paths follow the
# checkout, which is the only thing that is true in both trees.
SUBROUTINE_PATH = twp/remap_subs:twp/demos:../../subroutines/probe_basic:../../subroutines/tool_length_probe:../../subroutines/surfacemap
# NOT the suite's plain on_abort: on a TWP config the abort handler must also
# carry upstream's WCS-index resync (LinuxCNC #2745/#2908), or a desynced
# index leaves the next G53.x unable to find its plane — "no TWP defined",
# machine in limbo, cleared only by reloading. on_abort_twp does both halves.
ON_ABORT_COMMAND = O<on_abort_twp> call
REMAP=M600 modalgroup=6 ngc=m600
REMAP=M601 modalgroup=6 ngc=m601
# Switchkins toggles: M428 identity (startup), M429 TCP, M430 TOOL/plane.
REMAP=M428 modalgroup=10 ngc=428remap
REMAP=M429 modalgroup=10 ngc=429remap
REMAP=M430 modalgroup=10 ngc=430remap
# Tilted work plane. G53.1/.3/.6 orient the spindle to the plane normal;
# G68.2/.3/.4 define it; G69 cancels.
REMAP=G53.1 modalgroup=1 argspec=p      ngc=g531remap
REMAP=G53.3 modalgroup=1 argspec=pxyz   ngc=g533remap
REMAP=G53.6 modalgroup=1 argspec=p      ngc=g536remap
REMAP=M530  modalgroup=10               python=g53x_core
REMAP=G68.2 modalgroup=1 argspec=pqxyzijkr python=g682
REMAP=G68.3 modalgroup=1 argspec=xyzr      python=g683
REMAP=G68.4 modalgroup=1 argspec=pqxyzijkr python=g684
REMAP=G69   modalgroup=1                ngc=g69remap
REMAP=M469  modalgroup=10               python=g69_core
# lcnc-suite: Plane-mode touch-off (o<twp_touchoff> wrapper -> M535). The
# touched point (TOOL frame, G59) is mapped back through the plane and the
# live table pose and written to G54 — the ONE datum. IJK carry X/Y/Z (an
# M-code line cannot carry axis words, same as M530's I/J/K); P is the mask.
REMAP=M535  modalgroup=10 argspec=Pijk  python=twp_touchoff
USER_M_PATH = ./
FEATURES = 12

[PYTHON]
# The lcnc-suite FORK of the upstream TWP remap stack: task behaviour is
# identical, but the preview branch runs the plane math and emits the
# (WEBUI_KINSTYPE=n) / (WEBUI_TWPFRAME=p,t1,t2) marker comments the offline
# stack needs. See examples/sim_config/twp/README.md.
# Relative to this INI's directory — see the SUBROUTINE_PATH note above.
PATH_APPEND = twp/python
TOPLEVEL = twp/python/toplevel.py
LOG_LEVEL = 0

[TWP]
# Which spindle rotary is the primary orientation axis and which is the
# secondary (the one closest to the tool). remap.py reads these at import.
PRIMARY = C
SECONDARY = B

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = hallib/core_sim_6.hal
HALFILE = hallib/spindle_sim.hal
HALFILE = hallib/simulated_home_probe_basic.hal
HALFILE = hallib/sim_cannon.hal
HALFILE = hallib/lcnc_webui.hal

# ── switchable-kinematics wiring (runs after all HALFILEs) ──
# analog-out-02 = twp-status (0 undefined / 1 defined / 2 active),
# analog-out-03 = switchkins type. Both are needed, which is why
# core_sim_6.hal loads motmod with num_aio=4.
HALCMD = net twp-status       <= motion.analog-out-02
HALCMD = net :kinstype-select <= motion.analog-out-03 => motion.switchkins-type

# ── Z soft-limit window per kinematics mode ──
# The type-0 window in [AXIS_Z]/[JOINT_2] is lifted under TCP/TOOL kins via the
# ini.z.min_limit/max_limit pins (hallib/z_limit_window.hal, rationale inside).
# It is a POSTGUI file, run by the lcnc-suite display after `halcmd start`: a
# [HAL]HALCMD net onto an ini.* pin runs before the servo thread exists, inihal
# turns the link transient into a motion command, and task blocks — the boot
# timed out exactly there (2026-09-05).
POSTGUI_HALFILE = hallib/z_limit_window.hal

# Live tool-length offset into the kins. A `net`, NOT a setp: it is dynamic,
# and parse_kins_config deliberately refuses to parse it (the client already
# carries live TLO as wcs.tool, so a static copy here would double-count).
HALCMD = net :tool-offset motion.tooloffset.z => xyzacb_trsrn_kins.tool-offset-z

# ── static kins geometry ──
# These MUST be direct `setp` lines in [HAL]HALCMD. Both the gateway's
# parse_kins_config and the forked remap's preview branch read that form and
# ONLY that form — geometry seeded through net/sets signals (the upstream
# idiom) is invisible to both, and the preview would silently use zeros.
# Every pin is named even where the value is 0: an unnamed pin parses as
# ABSENT, which is indistinguishable from a typo, and kins_pivot_warning
# reports a partial set for that reason.
# The same seven numbers are the constants in scripts/vismach_to_stl_trsrn.py.
HALCMD = setp xyzacb_trsrn_kins.nut-angle 55
HALCMD = setp xyzacb_trsrn_kins.y-pivot 50
HALCMD = setp xyzacb_trsrn_kins.z-pivot 120
HALCMD = setp xyzacb_trsrn_kins.x-offset 0
HALCMD = setp xyzacb_trsrn_kins.y-offset 0
HALCMD = setp xyzacb_trsrn_kins.y-rot-axis -1000
HALCMD = setp xyzacb_trsrn_kins.z-rot-axis -2000

# ── TWP helper component ──
# Display/status only (it publishes the plane matrix for a vismach window),
# but the remaps hal.set_p into it during task, so it has to exist.
HALCMD = loadusr -W ./twp/python/twp-helper-comp.py
HALCMD = net twp-status                  => twp-helper-comp.twp-status
HALCMD = net twp-is-defined              <= twp-helper-comp.twp-is-defined
HALCMD = net twp-is-active               <= twp-helper-comp.twp-is-active
HALCMD = net twp-ox-world                <= twp-helper-comp.twp-ox-world
HALCMD = net twp-oy-world                <= twp-helper-comp.twp-oy-world
HALCMD = net twp-oz-world                <= twp-helper-comp.twp-oz-world
HALCMD = net twp-ox                      <= twp-helper-comp.twp-ox
HALCMD = net twp-oy                      <= twp-helper-comp.twp-oy
HALCMD = net twp-oz                      <= twp-helper-comp.twp-oz
HALCMD = net twp-zx                      <= twp-helper-comp.twp-zx
HALCMD = net twp-zy                      <= twp-helper-comp.twp-zy
HALCMD = net twp-zz                      <= twp-helper-comp.twp-zz
HALCMD = net twp-xx                      <= twp-helper-comp.twp-xx
HALCMD = net twp-xy                      <= twp-helper-comp.twp-xy
HALCMD = net twp-xz                      <= twp-helper-comp.twp-xz

HALUI = halui
TWOPASS = on

[HALUI]
HALUI = halui

[KINS]
# No `sparm=` on purpose: xyzacb_trsrn hardcodes 0=identity, 1=TCP,
# 2=TOOL/plane. Adding sparm=identityfirst out of habit would set
# identity_first in the wire declaration, which the client then ignores for
# this family — harmless, but it would misstate the machine.
KINEMATICS = xyzacb_trsrn
JOINTS = 6

[TRAJ]
AXES = 6
SPINDLES = 1
COORDINATES = X Y Z A B C
HOME = 0 0 0 0 0 0
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 200

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

#==================
#      X Axis
#==================

# Travels (2026-09-12): the upstream TWP demo shipped +/-5000 on X and Y —
# 10 m of travel through the portal and the bed, a box that told the
# operator nothing about the machine. These are taken from the model's own
# geometry: the head is at root (-1000, 1000, 2000) at joints zero, the
# column spans root X -2900..500, the platter face sits at root X -2400 and
# the fixture console reaches -500 — so X +/-1500 (root -2500..500) covers
# the platter and the console and stays inside the column. The corpus and
# demo programs stay inside these windows (validator-probed on every
# program, 2026-09-12); the joint-side soft-limit checks in the gateway
# tests carry their own limits and do not depend on this file.
[AXIS_X]
MIN_LIMIT = -1500
MAX_LIMIT = 1500
MAX_VELOCITY = 200
MAX_ACCELERATION = 700

[JOINT_0]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 200
MAX_ACCELERATION = 700
MIN_LIMIT = -1500
MAX_LIMIT = 1500
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

#==================
#      Y Axis
#==================

# Y is ASYMMETRIC on purpose: the head's home is 1000 in front of the
# trunnion axis (root Y 1000), the platter spans root Y +/-900 and the
# column front is at root Y 2600 (head depth 250), so -2000..1300 (root
# -1000..2300) reaches the whole platter and stops short of the column.
[AXIS_Y]
MIN_LIMIT = -2000
MAX_LIMIT = 1300
MAX_VELOCITY = 200
MAX_ACCELERATION = 700

[JOINT_1]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 200
MAX_ACCELERATION = 700
MIN_LIMIT = -2000
MAX_LIMIT = 1300
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

#==================
#      Z Axis
#==================

# Z0 is the TOP of travel — the real-machine convention (a mill homes at the
# top), and the joints-at-zero startup pose is then the parked pose (nose 2000
# above the A axis; machineTrsrn.test.ts "parked height"). Before 2026-09-05 Z
# was ±5000 like X/Y: 10 m of travel through the portal and the bed, and an
# operator could jog ABOVE machine zero, where "→ Zero"'s G53 Z0 retract became
# a descent. -2000 puts the nose at the A-axis height (the corpus' deepest
# commanded joint Z is -1683 → 317 mm margin; the model test sweeps to the
# floor). 0.01, not 0: HOME = 0 must lie strictly inside the window (the DMU
# precedent — LinuxCNC's soft-limit check would fault a joint homed exactly on
# its limit). X/Y carry the model-derived travels above (2026-09-12).
# This is the TYPE-0 window; the [HAL] block above lifts it under TCP/TOOL.
[AXIS_Z]
MIN_LIMIT = -2000
MAX_LIMIT = 0.01
MAX_VELOCITY = 200
MAX_ACCELERATION = 700
# smoothing for surface compensation Z offsets (LinuxCNC built-in)
OFFSET_AV_RATIO = 0.2

[JOINT_2]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 200
MAX_ACCELERATION = 700
MIN_LIMIT = -2000
MAX_LIMIT = 0.01
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

#==================
#     Spindle
#==================

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 3000
INCREMENT = 100
P = 0
I = 0
D = 0
FF0 = 1
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 2000

#==================
#   A Axis — rotary FACEPLATE (work side), axis along machine X
#==================

[AXIS_A]
MIN_LIMIT = -360
MAX_LIMIT = 360
MAX_VELOCITY = 30
MAX_ACCELERATION = 300

[JOINT_3]
TYPE = ANGULAR
HOME = 0.000
MAX_VELOCITY = 30
MAX_ACCELERATION = 300
MIN_LIMIT = -360
MAX_LIMIT = 360
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

#==================
#   B Axis — NUTATING spindle rotary (secondary, closest to the tool)
#==================

[AXIS_B]
MIN_LIMIT = -185
MAX_LIMIT = 185
MAX_VELOCITY = 30
MAX_ACCELERATION = 300

[JOINT_4]
TYPE = ANGULAR
HOME = 0.000
MAX_VELOCITY = 30
MAX_ACCELERATION = 300
MIN_LIMIT = -185
MAX_LIMIT = 185
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

#==================
#   C Axis — spindle swivel about Z (primary orientation axis)
#==================

[AXIS_C]
MIN_LIMIT = -320
MAX_LIMIT = 320
MAX_VELOCITY = 30
MAX_ACCELERATION = 300

[JOINT_5]
TYPE = ANGULAR
HOME = 0.000
MAX_VELOCITY = 30
MAX_ACCELERATION = 300
MIN_LIMIT = -320
MAX_LIMIT = 320
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
