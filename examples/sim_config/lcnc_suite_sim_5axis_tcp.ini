# TCP/switchkins variant of lcnc_suite_sim_5axis.ini (phase 0 of the
# TCP+TWP plan): same XYZAC trunnion machine and viewer model, but the
# kinematics module is xyzac-trt-kins with SWITCHABLE kinematics instead
# of trivkins. M-codes (adopted from the LinuxCNC 2.9.4 sample config
# sim/axis/vismach/5axis/table-rotary-tilting, see remap_subs/):
#   M429 = identity kins (startup default; behaves exactly like trivkins)
#   M428 = xyzac world kins (TCP-style: control solves XYZ joints so the
#          tool tip follows the programmed point while A/C rotate)
#   M430 = userk kins (type 2; unused here)
# Pivot geometry (y-offset 20, z-offset 10, rot-point 0,0,0) matches the
# machine-xyzac viewer model v2 — kins and 3D model agree by construction.
# PURPOSE: establish the phase-0 ground truth — live model + DRO behavior
# under TCP, and a documented baseline of what the offline dry-run stack
# (preview/scrub/collision) gets wrong in non-identity segments.
# Coordinates: X Y Z A C

[EMC]
VERSION = 1.1
MACHINE = lcnc-suite Sim TCP
DEBUG = 0

[DISPLAY]
DISPLAY = lcnc-suite
OPEN_FILE = ~/linuxcnc/nc_files/blank.ngc
CONFIRM_EXIT = False

# ─────────────────────────────────────────────────────────────────────
# lcnc-suite gateway settings (see lcnc_suite_sim_5axis.ini for the
# fully-commented reference; only the values live here)
# ─────────────────────────────────────────────────────────────────────
WEBUI_HOST = 0.0.0.0

# WEBUI_TOKEN: REQUIRED whenever WEBUI_HOST is non-loopback. Generate:
#     python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# WEBUI_TOKEN = <paste-generated-token-here>

WEBUI_PORT = 8000
WEBUI_BROWSER = 1
WEBUI_DEV = 0

# 3D viewer machine model: same XYZAC trunnion model as the trivkins sim.
WEBUI_MACHINE_DIR = ~/lcnc-suite/examples/sim_config/machine-xyzac

WEBUI_STATUS_DELTA = 1
WEBUI_ADAPTIVE_POLL = 1
WEBUI_IDLE_POLL_HZ = 5
WEBUI_WIRE_FORMAT = msgpack
WEBUI_WS_INIT_CONCURRENCY = 20
WEBUI_ASYNCIO_DEBUG = 0
WEBUI_GC_FREEZE = 0

DEBUG = 0
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 2.0
MIN_SPINDLE_OVERRIDE = 0.5
DEFAULT_SPINDLE_SPEED = 300
DEFAULT_LINEAR_VELOCITY = 25
MAX_LINEAR_VELOCITY = 80
MIN_LINEAR_VELOCITY = 0.1
DEFAULT_ANGULAR_VELOCITY = 5
MAX_ANGULAR_VELOCITY = 10
MIN_ANGULAR_VELOCITY = 1
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm
GEOMETRY = XYZ

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files

[RS274NGC]
RS274NGC_STARTUP_CODE = F100 S50 G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G91.1 G92.1 G94 G97 G98
# Separate var file — WCS offsets must not cross-contaminate the trivkins
# sim (lesson: a leftover rotary offset once ran a whole demo tilted).
PARAMETER_FILE = sim_tcp.var
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
# HAL_PIN_VARS: the switchkins remaps read #<_hal[motion.switchkins-type]>
# to verify the mode switch actually landed (task only).
HAL_PIN_VARS = 1
# Adjust paths below to where you cloned lcnc-suite
SUBROUTINE_PATH = ~/lcnc-suite/examples/sim_config/remap_subs:~/lcnc-suite/subroutines/probe_basic:~/lcnc-suite/subroutines/tool_length_probe:~/lcnc-suite/subroutines/surfacemap
ON_ABORT_COMMAND = O<on_abort> call
REMAP=M600 modalgroup=6 ngc=m600
REMAP=M601 modalgroup=6 ngc=m601
REMAP=M428 modalgroup=10 ngc=428remap
REMAP=M429 modalgroup=10 ngc=429remap
REMAP=M430 modalgroup=10 ngc=430remap
USER_M_PATH = ./
FEATURES = 12

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = hallib/core_sim_5.hal
HALFILE = hallib/spindle_sim.hal
HALFILE = hallib/simulated_home_probe_basic.hal
HALFILE = hallib/sim_cannon.hal
HALFILE = hallib/lcnc_webui.hal
HALFILE = hallib/vismach_xyzac.hal
# Switchable-kins wiring (runs after all HALFILEs):
# analog-out-02 drives the kins mode (00 = coolant angle, 02 was free;
# the shipped sample uses 03, which needs num_aio=4 — see remap_subs/).
HALCMD = net :kinstype-select motion.analog-out-02 => motion.switchkins-type
HALCMD = setp xyzac-trt-kins.x-rot-point 0
HALCMD = setp xyzac-trt-kins.y-rot-point 0
HALCMD = setp xyzac-trt-kins.z-rot-point 0
# Every geometry pin is set explicitly, including the zeros: a pin the INI
# does not name parses as ABSENT and the viewer's TCP math substitutes 0,
# which is indistinguishable from a misspelling. kins_pivot_warning reports
# a partial set for exactly that reason.
HALCMD = setp xyzac-trt-kins.x-offset 0
HALCMD = setp xyzac-trt-kins.y-offset 20
HALCMD = setp xyzac-trt-kins.z-offset 10
# vismach_xyzac.hal already nets motion.tooloffset.z into the
# vismach-tool-offset signal — join it (a pin links to ONE signal only).
HALCMD = net vismach-tool-offset => xyzac-trt-kins.tool-offset
HALUI = halui
TWOPASS = on

[HALUI]
HALUI = halui

[TRAJ]
AXES = 5
SPINDLES = 1
COORDINATES = X Y Z A C
HOME = 0 0 0 0 0
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 100

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
# sparm=identityfirst: switchkins-type 0 = identity (trivkins-equivalent,
# startup default), 1 = xyzac world kins, 2 = userk.
KINEMATICS = xyzac-trt-kins sparm=identityfirst
JOINTS = 5

#==================
#      X Axis
#==================

[AXIS_X]
# Travels match the vismach xyzac-trt model (desktop-scale machine,
# table ±150) so the 3D machine model and the motion envelope agree.
MIN_LIMIT = -200
MAX_LIMIT = 200
MAX_VELOCITY = 100
MAX_ACCELERATION = 750

[JOINT_0]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 100
MAX_ACCELERATION = 750
BACKLASH = 0.003
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
MIN_LIMIT = -200
MAX_LIMIT = 200
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 100
HOME_LATCH_VEL = 5
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1
HOME_IS_SHARED = 1

#==================
#      Y Axis
#==================

[AXIS_Y]
MIN_LIMIT = -70
MAX_LIMIT = 70
MAX_VELOCITY = 100
MAX_ACCELERATION = 750

[JOINT_1]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 100
MAX_ACCELERATION = 750
BACKLASH = 0.003
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
MIN_LIMIT = -70
MAX_LIMIT = 70
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 100
HOME_LATCH_VEL = 5
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1
HOME_IS_SHARED = 1

#==================
#      Z Axis
#==================

[AXIS_Z]
MIN_LIMIT = -30
MAX_LIMIT = 100
MAX_VELOCITY = 80
MAX_ACCELERATION = 750
# smoothing for surface compensation Z offsets (LinuxCNC built-in)
OFFSET_AV_RATIO = 0.2

[JOINT_2]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 80
MAX_ACCELERATION = 750
BACKLASH = 0.003
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
MIN_LIMIT = -30
MAX_LIMIT = 100
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 1.0
HOME_SEARCH_VEL = 100
HOME_LATCH_VEL = 5
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0
HOME_IS_SHARED = 1

#==================
#     Spindle
#==================

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 3000
INCREMENT = 100
P = 0
I = 0
D = 0
FF0 = 1
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 2000

#==================
#      A Axis (sim: homes instantly, no switch)
#==================

[AXIS_A]
# Physical trunnion tilt range (matches the vismach model / sample config)
MIN_LIMIT = -100
MAX_LIMIT = 50
MAX_VELOCITY = 60
MAX_ACCELERATION = 500

[JOINT_3]
TYPE = ANGULAR
HOME = 0.000
MAX_VELOCITY = 60
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 50
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 2

#==================
#      C Axis (sim: homes instantly, no switch)
#==================

[AXIS_C]
# Continuous rotary (±100 turns, matches sample config)
MIN_LIMIT = -36000
MAX_LIMIT = 36000
MAX_VELOCITY = 60
MAX_ACCELERATION = 500

[JOINT_4]
TYPE = ANGULAR
HOME = 0.000
MAX_VELOCITY = 60
MAX_ACCELERATION = 500
MIN_LIMIT = -36000
MAX_LIMIT = 36000
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 2
